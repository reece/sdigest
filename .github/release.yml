# Sections for GitHub's generated release notes, which list merged pull
# requests by label. Changes need to land through PRs to appear.
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Added
      labels: [enhancement]
    - title: Fixed
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies, github_actions]
    - title: Other changes
      labels: ["*"]
