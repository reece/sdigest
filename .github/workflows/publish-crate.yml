name: Publish crate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check that the tag matches the Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  # Trusted publishing: crates.io trusts this workflow, so no token secret is
  # stored. It can only be configured for an existing crate, so the first
  # version must be published by hand; versions already on crates.io are
  # skipped.
  publish:
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip if this version is already on crates.io
        id: exists
        run: |
          if curl -sf -A "sdigest-ci (github.com/reece/sdigest)" \
              "https://crates.io/api/v1/crates/sdigest/${GITHUB_REF_NAME#v}" > /dev/null; then
            echo "::notice::sdigest ${GITHUB_REF_NAME#v} is already on crates.io; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published != 'true'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - if: steps.exists.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - if: steps.exists.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
