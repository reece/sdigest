name: Publish crate

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Trusted publishing: crates.io trusts this workflow, so no token secret is
  # stored. It can only be configured for an existing crate, so the first
  # version must be published by hand; versions already on crates.io are
  # skipped.
  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip if this version is already on crates.io
        id: exists
        run: |
          if curl -sf -A "sdigest-ci (github.com/reece/sdigest)" \
              "https://crates.io/api/v1/crates/sdigest/${GITHUB_REF_NAME}" > /dev/null; then
            echo "::notice::sdigest ${GITHUB_REF_NAME} is already on crates.io; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published != 'true'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - if: steps.exists.outputs.published != 'true'
        run: .github/scripts/stamp-version
      - if: steps.exists.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - if: steps.exists.outputs.published != 'true'
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
