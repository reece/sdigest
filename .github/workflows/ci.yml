name: CI

# Jobs run the same `just` recipes developers run locally (see justfile).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cqa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Pull requests lint only the files they change, which needs the base branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: just@1.58.0
      - name: Lint (pull requests check changed files; pushes check all files)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            just cqa --from-ref "origin/$BASE_REF" --to-ref HEAD
          else
            just cqa
          fi

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: just@1.58.0
      - run: just test-rust

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the toolchain named by rust-version in Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: just@1.58.0
      - run: just test-rust

  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: just@1.58.0
      - run: just test-python

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: just@1.58.0
      - run: just build
