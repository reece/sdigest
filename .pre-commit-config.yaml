repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-shebang-scripts-are-executable
        exclude: \.rs$  # #![...] attributes look like shebangs
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: canonicalize-gitignore
        name: Sort unique .gitignore
        entry: sh -c 'LC_ALL=C sort -u -o .gitignore .gitignore'
        language: system
        files: ^\.gitignore$
      - id: bench-append-only
        name: Benchmark records are append-only
        entry: >-
          sh -c 'git diff --cached --name-only --diff-filter=MR --
          bench/runs bench/hosts bench/devices bench/datasets bench/annotations
          | grep . && { echo "modify nothing above; append new files instead
          (deleting to prune is fine)"; exit 1; } || exit 0'
        language: system
        files: ^bench/(runs|hosts|devices|datasets|annotations)/
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
